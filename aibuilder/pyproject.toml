[project]
name = "aibuilder"
version = "0.1.0"
description = "Chat-driven repo analyzer + AWS architecture/cost estimator"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# Test fixtures are deliberately minimal sample apps that mimic real repos —
# the analyzer parses them. Don't reformat or "fix" them.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
