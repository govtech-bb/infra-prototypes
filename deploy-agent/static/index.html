<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INFRA Deploy Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0d0d0d;
      --surface:    #161616;
      --surface2:   #1f1f1f;
      --border:     #2a2a2a;
      --accent:     #5b6af5;
      --accent-dim: #3d4bcc;
      --green:      #22c55e;
      --red:        #ef4444;
      --text:       #e2e2e2;
      --text-dim:   #888;
      --radius:     10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .logo {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff;
    }
    header h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
    header span { font-size: 12px; color: var(--text-dim); margin-left: 4px; }

    /* ── Main layout ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar (upload) ── */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      overflow-y: auto;
    }
    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
    }

    /* ── Drop zone ── */
    .dropzone {
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      padding: 20px 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(91, 106, 245, 0.06);
    }
    .dropzone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .dropzone-icon { font-size: 22px; margin-bottom: 6px; }
    .dropzone p { font-size: 12px; color: var(--text-dim); line-height: 1.4; }
    .dropzone strong { color: var(--text); }

    /* ── File list ── */
    .file-list { display: flex; flex-direction: column; gap: 4px; }
    .file-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px;
      background: var(--surface2);
      border-radius: 6px;
      padding: 6px 8px;
      overflow: hidden;
    }
    .file-item .icon { flex-shrink: 0; opacity: 0.5; }
    .file-item .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .file-count {
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      padding-top: 4px;
    }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Message bubbles ── */
    .msg {
      display: flex;
      gap: 10px;
      max-width: 740px;
      animation: fadeUp 0.18s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
    }
    .msg.agent .avatar { background: var(--accent); color: #fff; }
    .msg.user  .avatar { background: var(--surface2); color: var(--text-dim); }

    .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--accent);
      border-color: var(--accent-dim);
      color: #fff;
    }

    /* ── Success banner ── */
    .success-banner {
      margin: 0 20px 0;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fadeUp 0.25s ease;
    }
    .success-banner .check { font-size: 20px; }
    .success-banner .label { font-size: 13px; color: var(--text-dim); }
    .success-banner .url {
      font-size: 14px;
      font-weight: 600;
      color: var(--green);
      text-decoration: none;
      word-break: break-all;
    }
    .success-banner .url:hover { text-decoration: underline; }

    /* ── Typing indicator ── */
    .typing {
      display: flex; gap: 4px; align-items: center;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: fit-content;
    }
    .dot {
      width: 6px; height: 6px;
      background: var(--text-dim);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-5px); }
    }

    /* ── Input bar ── */
    .input-bar {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface);
      flex-shrink: 0;
    }
    textarea {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      padding: 10px 14px;
      resize: none;
      max-height: 120px;
      overflow-y: auto;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--text-dim); }

    button.send {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 18px;
      height: 40px;
      flex-shrink: 0;
      transition: background 0.15s, opacity 0.15s;
    }
    button.send:hover:not(:disabled) { background: var(--accent-dim); }
    button.send:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Empty state ── */
    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-dim);
      text-align: center;
      padding: 40px;
      pointer-events: none;
      user-select: none;
    }
    .empty .big { font-size: 36px; }
    .empty h2 { font-size: 16px; font-weight: 600; color: var(--text); }
    .empty p  { font-size: 13px; max-width: 320px; line-height: 1.5; }
  </style>
</head>
<body>

<header>
  <div class="logo">⬡</div>
  <h1>INFRA Deploy Agent</h1>
  <span>static website hosting</span>
</header>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-title">Website Files</div>

    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" multiple accept="*/*" />
      <div class="dropzone-icon">📂</div>
      <p><strong>Drop files here</strong><br/>or click to browse</p>
    </div>

    <div class="file-list" id="fileList"></div>
    <div class="file-count" id="fileCount"></div>
  </aside>

  <!-- Chat -->
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="empty" id="emptyState">
        <div class="big">🚀</div>
        <h2>Ready to deploy</h2>
        <p>Upload your website files, then chat with the agent to get your site live on AWS.</p>
      </div>
    </div>

    <div id="successBanner" style="display:none" class="success-banner">
      <span class="check">✅</span>
      <div>
        <div class="label">Your site is live</div>
        <a class="url" id="siteUrl" href="#" target="_blank" rel="noopener"></a>
      </div>
    </div>

    <div class="input-bar">
      <textarea
        id="input"
        rows="1"
        placeholder="Chat with the deploy agent…"
        autocomplete="off"
      ></textarea>
      <button class="send" id="sendBtn">Send</button>
    </div>
  </div>

</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let sessionId = null;
  let uploadedFiles = [];
  let isLoading = false;

  const messagesEl  = document.getElementById('messages');
  const inputEl     = document.getElementById('input');
  const sendBtn     = document.getElementById('sendBtn');
  const fileInput   = document.getElementById('fileInput');
  const fileList    = document.getElementById('fileList');
  const fileCount   = document.getElementById('fileCount');
  const dropzone    = document.getElementById('dropzone');
  const emptyState  = document.getElementById('emptyState');
  const successBanner = document.getElementById('successBanner');
  const siteUrlEl   = document.getElementById('siteUrl');

  // ── Session init ───────────────────────────────────────────────────────────
  async function init() {
    const res  = await fetch('/api/session');
    const data = await res.json();
    sessionId  = data.session_id;

    // Post opening message from agent
    appendMessage('agent', "Hi! I'm the INFRA Deploy Agent. Upload your website files on the left, then tell me what you'd like to host and I'll get it live on AWS for you.");
  }

  // ── File upload ────────────────────────────────────────────────────────────
  fileInput.addEventListener('change', () => handleFiles(fileInput.files));

  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });

  async function handleFiles(files) {
    if (!files || files.length === 0) return;

    const form = new FormData();
    for (const f of files) form.append('files', f);

    try {
      const res  = await fetch(`/api/upload/${sessionId}`, { method: 'POST', body: form });
      const data = await res.json();
      uploadedFiles = [...uploadedFiles, ...data.uploaded];
      renderFileList();
    } catch (err) {
      console.error('Upload error:', err);
    }
  }

  function renderFileList() {
    fileList.innerHTML = uploadedFiles.map(name => `
      <div class="file-item">
        <span class="icon">${getFileIcon(name)}</span>
        <span class="name" title="${name}">${name}</span>
      </div>
    `).join('');
    fileCount.textContent = uploadedFiles.length > 0
      ? `${uploadedFiles.length} file${uploadedFiles.length > 1 ? 's' : ''} ready`
      : '';
  }

  function getFileIcon(name) {
    const ext = name.split('.').pop().toLowerCase();
    const map = { html: '🌐', css: '🎨', js: '⚡', ts: '⚡', jsx: '⚡', tsx: '⚡',
                  png: '🖼', jpg: '🖼', jpeg: '🖼', gif: '🖼', svg: '🖼', webp: '🖼',
                  json: '📋', md: '📄', txt: '📄', ico: '🔷', woff: '🔤', woff2: '🔤' };
    return map[ext] || '📎';
  }

  // ── Chat ───────────────────────────────────────────────────────────────────
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });
  sendBtn.addEventListener('click', sendMessage);

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isLoading) return;

    // Hide empty state on first message
    if (emptyState) emptyState.style.display = 'none';

    appendMessage('user', text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    setLoading(true);

    const typingEl = appendTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text })
      });
      const data = await res.json();

      typingEl.remove();
      appendMessage('agent', data.message);

      if (data.deployment && data.deployment.site_url) {
        showSuccess(data.deployment.site_url);
      }
    } catch (err) {
      typingEl.remove();
      appendMessage('agent', '⚠️ Something went wrong connecting to the agent. Check that the server is running.');
    } finally {
      setLoading(false);
    }
  }

  function appendMessage(role, text) {
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'agent' ? '⬡' : 'U';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return msg;
  }

  function appendTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg agent';
    msg.innerHTML = `
      <div class="avatar">⬡</div>
      <div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    `;
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return msg;
  }

  function setLoading(val) {
    isLoading = val;
    sendBtn.disabled = val;
    inputEl.disabled = val;
  }

  function showSuccess(url) {
    siteUrlEl.href = url;
    siteUrlEl.textContent = url;
    successBanner.style.display = 'flex';
  }

  // ── Boot ───────────────────────────────────────────────────────────────────
  init();
</script>
</body>
</html>
