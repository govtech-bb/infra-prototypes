name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy-agent-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        working-directory: deploy-agent
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: deploy-agent
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: deploy-agent
        run: pytest tests/ -v

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.0"

      - name: Tofu fmt check
        working-directory: infra
        run: tofu fmt -recursive -check

      - name: Tofu validate
        working-directory: infra/stacks/static-website
        run: |
          tofu init -backend=false
          tofu validate

  aibuilder-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        working-directory: aibuilder
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: aibuilder
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: aibuilder
        run: pytest tests/ -v
